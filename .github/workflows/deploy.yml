name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - claude/ios-bike-parks-app-4n2rc
      - claude/ticket-planer-saalbach-6ftztg
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /Bike-Park-Map/
      - name: Add Ticket-Planer Saalbach Hinterglemm (standalone, no build step)
        run: cp -r ticket-planer-saalbach dist/ticket-planer-saalbach
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

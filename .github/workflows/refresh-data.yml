name: Refresh OSM data (weekly)

on:
  schedule:
    # Every Sunday at 04:00 UTC
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/ios-bike-parks-app-4n2rc
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run refresh script
        run: node scripts/refresh-data.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain public/data/bikeparks.json) ]]; then
            git add public/data/bikeparks.json
            git commit -m "Weekly OSM data refresh ($(date -u +%Y-%m-%d))"
            git push origin HEAD:claude/ios-bike-parks-app-4n2rc
            echo "Committed and pushed updates."
          else
            echo "No changes."
          fi
